<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PresenzeTeam - Timeline</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & Icone Lucide -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fc; }
        .timeline-scroll { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg text-slate-900 leading-tight">PresenzeTeam</h1>
                    <p class="text-[11px] text-slate-500">Timeline & Gestione Presenze</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <span id="firebase-status" class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-800">
                    <span class="w-2 h-2 mr-1.5 bg-amber-500 rounded-full"></span> Locale
                </span>
                <button onclick="apriConfigModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-xl text-sm transition-colors" title="Configura Firebase">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-6 space-y-6">
        
        <!-- Header Sezione stile Dashboard -->
        <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <div class="flex items-center space-x-2 text-indigo-600 font-semibold text-xs uppercase tracking-wider mb-1">
                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                    <span>Vista Timeline Settimanale</span>
                </div>
                <h2 class="text-xl font-bold text-slate-900">Gestione Presenze e Assenze</h2>
            </div>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <div class="flex items-center space-x-2">
                    <input type="text" id="nuovo-collega-nome" placeholder="Nome nuovo collega..." class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm flex-grow focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="aggiungiCollega()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors shadow-sm flex items-center justify-center space-x-1.5 whitespace-nowrap">
                        <i data-lucide="user-plus" class="w-4 h-4"></i>
                        <span>Aggiungi</span>
                    </button>
                </div>
                <button onclick="salvaTutto()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2 rounded-xl text-sm transition-all shadow-md shadow-emerald-100 flex items-center justify-center space-x-2">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Salva</span>
                </button>
            </div>
        </div>

        <!-- Timeline / Tabella Principale stile Bizneo -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="timeline-scroll overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[780px]">
                    <thead>
                        <tr id="timeline-header" class="bg-slate-50/90 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <!-- Generato dinamicamente con le date della settimana -->
                        </tr>
                    </thead>
                    <tbody id="timeline-body" class="divide-y divide-slate-100 text-sm">
                        <!-- Generato via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal Configurazione Firebase -->
    <div id="config-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-slate-900">Configurazione Firebase (Opzionale)</h3>
            <p class="text-xs text-slate-500">Incolla qui la configurazione JSON di Firebase per sincronizzare in tempo reale.</p>
            <textarea id="firebase-config-input" rows="6" class="w-full font-mono text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none" placeholder='{ apiKey: "...", projectId: "..." }'></textarea>
            <div class="flex justify-end space-x-3">
                <button onclick="chiudiConfigModal()" class="px-4 py-2 text-sm text-slate-600">Annulla</button>
                <button onclick="salvaConfigFirebase()" class="px-5 py-2 text-sm font-medium text-white bg-indigo-600 rounded-xl">Salva</button>
            </div>
        </div>
    </div>

    <!-- Script Applicativo -->
    <script>
        lucide.createIcons();

        let colleghi = JSON.parse(localStorage.getItem('team_colleghi')) || ['Marco Lotti', 'Luana Andreoni', 'Maria Rossi'];
        let pianificazione = JSON.parse(localStorage.getItem('team_pianificazione')) || {};

        // Calcola i giorni della settimana corrente (Lun-Ven) con le date reali
        function getGiorniLavorativiCorrenti() {
            let curr = new Date();
            let first = curr.getDate() - curr.getDay() + 1; // Lunedì
            let giorni = [];
            
            let nomiGiorni = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì'];
            
            for (let i = 0; i < 5; i++) {
                let d = new Date(curr.setDate(first + i));
                let giornoNome = nomiGiorni[i];
                let giornoNum = d.getDate();
                giorni.push({ nome: giornoNome, label: `${giornoNome} ${giornoNum}` });
            }
            return giorni;
        }

        const giorniLavorativi = getGiorniLavorativiCorrenti();

        window.addEventListener('DOMContentLoaded', () => {
            renderHeader();
            renderTimeline();
        });

        function renderHeader() {
            const headerTr = document.getElementById('timeline-header');
            let thCols = giorniLavorativi.map(g => `<th class="py-4 px-3 text-center">${g.label}</th>`).join('');
            headerTr.innerHTML = `
                <th class="py-4 px-5 w-52">Dipendente</th>
                ${thCols}
                <th class="py-4 px-3 text-center w-16">Azioni</th>
            `;
        }

        function renderTimeline() {
            const tbody = document.getElementById('timeline-body');
            
            if (colleghi.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-10 text-center text-slate-400 italic">Nessun dipendente registrato.</td></tr>`;
                return;
            }

            tbody.innerHTML = colleghi.map(collega => {
                if (!pianificazione[collega]) {
                    pianificazione[collega] = {};
                }

                let celleGiorni = giorniLavorativi.map(g => {
                    let giust = pianificazione[collega][g.nome] || '';
                    
                    // Stili badge colorati in stile Bizneo
                    let badgeClass = "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100";
                    let icona = "🏢";
                    let testo = "Ufficio";

                    if(giust === 'Ferie') { badgeClass = "bg-purple-100 text-purple-800 border-purple-300 font-semibold shadow-sm"; icona = "🏖️"; testo = "Ferie"; }
                    else if(giust === 'Permesso') { badgeClass = "bg-blue-100 text-blue-800 border-blue-300 font-semibold shadow-sm"; icona = "⏱️"; testo = "Permesso"; }
                    else if(giust === 'Malattia') { badgeClass = "bg-rose-100 text-rose-800 border-rose-300 font-semibold shadow-sm"; icona = "🏥"; testo = "Malattia"; }
                    else if(giust === 'Smart Working') { badgeClass = "bg-emerald-100 text-emerald-800 border-emerald-300 font-semibold shadow-sm"; icona = "💻"; testo = "Smart"; }

                    return `
                        <td class="py-3 px-2 text-center">
                            <select onchange="cambiaStato('${collega}', '${g.nome}', this.value)" class="w-full text-xs border rounded-xl py-2 px-1 text-center font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all cursor-pointer ${badgeClass}">
                                <option value="" ${!giust ? 'selected' : ''}>🏢 Ufficio</option>
                                <option value="Ferie" ${giust === 'Ferie' ? 'selected' : ''}>🏖️ Ferie</option>
                                <option value="Permesso" ${giust === 'Permesso' ? 'selected' : ''}>⏱️ Permesso</option>
                                <option value="Malattia" ${giust === 'Malattia' ? 'selected' : ''}>🏥 Malattia</option>
                                <option value="Smart Working" ${giust === 'Smart Working' ? 'selected' : ''}>💻 Smart Working</option>
                            </select>
                        </td>
                    `;
                }).join('');

                const iniziali = collega.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

                return `
                    <tr class="hover:bg-slate-50/70 transition-colors">
                        <td class="py-3.5 px-5 flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-700 flex items-center font-bold text-xs justify-center flex-shrink-0 shadow-inner">
                                ${iniziali}
                            </div>
                            <div>
                                <span class="font-semibold text-slate-900 block truncate">${collega}</span>
                                <span class="text-[11px] text-slate-400 block">Team</span>
                            </div>
                        </td>
                        ${celleGiorni}
                        <td class="py-3.5 px-2 text-center">
                            <button onclick="rimuoviCollega('${collega}')" class="text-slate-400 hover:text-rose-600 p-1.5 transition-colors rounded-lg hover:bg-rose-50" title="Rimuovi collega">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            lucide.createIcons();
        }

        function cambiaStato(collega, giorno, valore) {
            if(!pianificazione[collega]) pianificazione[collega] = {};
            pianificazione[collega][giorno] = valore;
            renderTimeline();
        }

        function salvaTutto() {
            localStorage.setItem('team_colleghi', JSON.stringify(colleghi));
            localStorage.setItem('team_pianificazione', JSON.stringify(pianificazione));
            alert('Timeline salvata con successo!');
        }

        function aggiungiCollega() {
            const input = document.getElementById('nuovo-collega-nome');
            const nome = input.value.trim();
            if(!nome) return;
            if(colleghi.includes(nome)) { alert('Collega già presente'); return; }

            colleghi.push(nome);
            input.value = '';
            salvaTutto();
            renderTimeline();
        }

        function rimuoviCollega(nome) {
            if(colleghi.length <= 1) { alert('Impossibile rimuovere l\'unico dipendente rimasto'); return; }
            if(confirm(`Vuoi rimuovere ${nome}?`)) {
                colleghi = colleghi.filter(c => c !== nome);
                delete pianificazione[nome];
                salvaTutto();
                renderTimeline();
            }
        }

        // Config Firebase
        function apriConfigModal() { document.getElementById('config-modal').classList.remove('hidden'); }
        function chiudiConfigModal() { document.getElementById('config-modal').classList.add('hidden'); }
        function salvaConfigFirebase() {
            const val = document.getElementById('firebase-config-input').value.trim();
            try {
                const cfg = JSON.parse(val);
                localStorage.setItem('firebase_config_json', JSON.stringify(cfg));
                chiudiConfigModal();
                alert('Configurazione salvata!');
            } catch(e) { alert('JSON non valido'); }
        }
    </script>
</body>
</html>
